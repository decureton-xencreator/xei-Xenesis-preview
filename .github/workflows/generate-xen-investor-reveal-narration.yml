name: Generate Xen Investor Reveal narration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/xen-investor-reveal-narration-copy-v1.mjs'
      - 'scripts/generate-xen-investor-reveal-narration.mjs'
      - 'scripts/verify-xen-investor-reveal-narration.mjs'
      - 'governance/XVS-001-CANONICAL-VOICE.json'
      - '.github/workflows/generate-xen-investor-reveal-narration.yml'

permissions:
  contents: write

concurrency:
  group: xen-investor-reveal-narration
  cancel-in-progress: false

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Generate 34 approved people-first Marin masters
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-xen-investor-reveal-narration.mjs
      - name: XQC and Warden narration verification
        run: node scripts/verify-xen-investor-reveal-narration.mjs
      - name: Commit verified Investor Reveal narration package
        run: |
          git config user.name "xen-voice-master"
          git config user.email "actions@users.noreply.github.com"
          git add assets/narration/investor-reveal-v1
          if ! git diff --cached --quiet; then
            git commit -m "Generate Xen Investor Reveal narration v1"
            git push
          fi

# XQC-001 generation trigger
